name: lint

on: push

# GITHUB_TOKEN は読み取り専用にする(書き込み権限を要する job はない)
permissions:
  contents: read

# 同一ブランチへの連続 push で古い実行を自動キャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node / pnpm は mise.toml の固定バージョンで用意する
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Type Check
        run: pnpm run typecheck

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # gitleaks git はコミット単位で走査するため全履歴が必要(既定の depth 1 だと 1 コミットしか見ない)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # gitleaks は mise.toml の固定バージョンで用意する
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Secret Scan
        run: mise run secret-scan
