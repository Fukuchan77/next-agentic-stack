name: lint

on: push

# 同一ブランチへの連続 push で古い実行を自動キャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Node / pnpm は mise.toml の固定バージョンで用意する
      - uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Type Check
        run: pnpm run typecheck

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # gitleaks git はコミット単位で走査するため全履歴が必要(既定の depth 1 だと 1 コミットしか見ない)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks は mise.toml の固定バージョンで用意する
      - uses: jdx/mise-action@v4

      - name: Secret Scan
        run: mise run secret-scan
