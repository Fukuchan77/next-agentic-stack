name: tests

on: push

# 同一ブランチへの連続 push で古い実行を自動キャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Node / pnpm は mise.toml の固定バージョンで用意する
      - uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=moderate

      - name: Test
        run: pnpm exec vitest run --coverage

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Bundle Size Check
        run: pnpm run size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Playwright 1.64 はプレリリース(alpha)のため公式コンテナイメージ
      # (mcr.microsoft.com/playwright)が存在しない。正式版の公開後は
      # `container: image: mcr.microsoft.com/playwright:v1.64.x-noble` に戻し、このステップを削除する。
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Build
        run: pnpm run build

      - name: E2E Tests
        run: pnpm exec playwright test
